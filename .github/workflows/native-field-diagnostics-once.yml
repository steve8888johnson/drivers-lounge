name: One-time native field diagnostics integration
on:
  push:
    branches: [feature/native-field-diagnostics]
    paths: [.github/workflows/native-field-diagnostics-once.yml]
permissions:
  contents: write
concurrency:
  group: native-field-diagnostics-once
  cancel-in-progress: false
jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/native-field-diagnostics
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Reconstruct and verify tested patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/patches -name 'native-field-diagnostics.*.b64' -type f | wc -l)" -eq 14
          cat .github/patches/native-field-diagnostics.*.b64 | tr -d '\n' | base64 --decode > /tmp/native-field-diagnostics.patch.gz
          echo '62e0fbf78f835fa580c8ddbde6575f85de68fe3c939353cca4e5d18fbda8ba5c  /tmp/native-field-diagnostics.patch.gz' | sha256sum --check --strict
          gzip --decompress --stdout /tmp/native-field-diagnostics.patch.gz > /tmp/native-field-diagnostics.patch
          echo '311c7ca74e1b3e32deacc0df684f737ced5a900132da2a5023b79020cbe6b8e6  /tmp/native-field-diagnostics.patch' | sha256sum --check --strict
          git apply --index --whitespace=error /tmp/native-field-diagnostics.patch
          git diff --cached --check
      - run: npm ci
      - run: npm ci --prefix mobile
      - run: npm test --prefix mobile
      - run: npm test
      - run: npm run check:syntax
      - run: npm run check:store
      - run: npm run check:links
      - name: Verify runtime dependency audit
        run: npm audit --prefix mobile --omit=dev --audit-level=moderate
      - name: Build native web bundle and generated projects
        env:
          DL_API_ORIGIN: https://drivers-lounge-f2fjsdxfm-steves-projects-c46af6ff.vercel.app
        run: |
          set -euo pipefail
          npm run build --prefix mobile
          node mobile/scripts/platforms.mjs android ios
          node - <<'NODE'
          const fs=require('node:fs');
          const meta=JSON.parse(fs.readFileSync('mobile/www/native-build.json','utf8'));
          if(meta.foregroundGuidanceOnly!==false||meta.backgroundGuidance!==true||meta.nativeDiagnostics!==true||meta.diagnosticsPrivacy!=='local-no-coordinates')throw Error('Native diagnostics metadata mismatch.');
          NODE
          grep -q 'versionCode 2000003' mobile/android/app/build.gradle
          grep -q 'CURRENT_PROJECT_VERSION = 2000003' mobile/ios/App/App.xcodeproj/project.pbxproj
          test -f mobile/www/native-diagnostics.html
          test -f mobile/www/assets/native-diagnostics-ui.js
          test -f mobile/www/assets/native-diagnostics.css
      - name: Commit tested source and remove transfer files
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .github/patches .github/workflows/native-field-diagnostics-once.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'add privacy-safe native field diagnostics'
          git push origin HEAD:feature/native-field-diagnostics
