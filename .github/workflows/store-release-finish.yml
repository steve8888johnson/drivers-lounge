name: Finalize store release package
on:
  push:
    branches: [feature/store-release-package]
permissions:
  contents: write
concurrency:
  group: store-release-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/store-release-package
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Apply final source disclosures and gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('mobile/src/runtime.mjs');s=p.read_text()
          old='While guidance is active, location continues with the screen locked or another app open. Android shows a persistent navigation notification; iOS shows the system location indicator. Tap Stop guidance to end background location use.'
          new='Drivers Lounge collects precise location data to provide live truck guidance, route progress and deviation warnings even when the screen is locked or another app is open. Location use starts only after you tap Start guidance and ends when you tap Stop guidance. It is not used for advertising or analytics. Android shows a persistent navigation notification; iOS shows the system location indicator.'
          if old not in s: raise SystemExit('Native location disclosure marker missing')
          p.write_text(s.replace(old,new,1))

          p=Path('src/privacy.html');s=p.read_text()
          s=s.replace('updated November 4, 2026','updated November 5, 2026')
          old='<article class="card"><h3>Location information</h3><p>Location may be used for navigation, nearby road intelligence and driver reports when you permit access. You can deny or revoke location permission in your device or browser settings. Drivers Lounge should not require continuous location access for features that do not need it.</p></article>'
          new='<article class="card"><h3>Location information</h3><p>Location may be used for navigation, nearby road intelligence and driver reports when you permit access. In the installed native app, Drivers Lounge collects precise location data to enable live truck guidance, route progress and deviation warnings even when the screen is locked or another app is open. Background location begins only after you start reviewed guidance and ends when you tap Stop guidance or guidance is stopped. Android shows a persistent navigation notification and iOS shows the system location indicator while it is active. Location is not used for advertising or analytics and is not automatically uploaded as continuous location history. You can deny or revoke location permission in your device settings; features that do not need location do not require continuous access.</p></article>'
          if old not in s: raise SystemExit('Privacy location marker missing')
          p.write_text(s.replace(old,new,1))

          p=Path('mobile/TESTING.md');s=p.read_text()
          s=s.replace('# Drivers Lounge testing — November 4, 2026','# Drivers Lounge testing — November 5, 2026')
          s=s.replace('1. Download Drivers-Lounge-Test.apk from the supplied test download.','1. Download `Drivers-Lounge-Field-Evidence-2.0.2-rc1.apk` from the supplied test download and verify its SHA-256 file before installation.')
          if 'Build under test: **2.0.2-rc.1 / 2000004**.' not in s:
              marker='Keep using your established navigation and issued permits for actual driving.'
              if marker not in s: raise SystemExit('Testing guide build marker missing')
              s=s.replace(marker,marker+'\n\nBuild under test: **2.0.2-rc.1 / 2000004**.',1)
          p.write_text(s)

          p=Path('scripts/check-store-readiness.mjs');s=p.read_text()
          old="'store/rc2-store-metadata.json','store/rc2-submission-copy.md',"
          new="'store/rc2-store-metadata.json','store/rc2-submission-copy.md','store/background-location-declaration.md','store/native-release-record.md',"
          if old not in s: raise SystemExit('Store required-file marker missing')
          p.write_text(s.replace(old,new,1))
          PY
      - run: npm ci
      - run: npm ci --prefix mobile
      - run: npm test
      - run: npm test --prefix mobile
      - run: npm run check:syntax
      - run: npm run check:store-submission
      - run: npm run check:store
      - name: Build complete web release gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://store-release-ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_store_release_ci_validation_only_123456789
          VERCEL_ENV: preview
        run: npm run build
      - name: Build native bundle and verify both identifier modes
        shell: bash
        run: |
          set -euo pipefail
          DL_API_ORIGIN=https://drivers-lounge-ri54f1zpc-steves-projects-c46af6ff.vercel.app npm run build --prefix mobile
          node mobile/scripts/platforms.mjs android ios
          grep -q 'applicationId "dev.atlasdigital.driverslounge.preview"' mobile/android/app/build.gradle
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = dev.atlasdigital.driverslounge.preview;' mobile/ios/App/App.xcodeproj/project.pbxproj
          DL_PRODUCTION_BUILD=1 node mobile/scripts/platforms.mjs android ios
          grep -q 'applicationId "dev.atlasdigital.driverslounge"' mobile/android/app/build.gradle
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = dev.atlasdigital.driverslounge;' mobile/ios/App/App.xcodeproj/project.pbxproj
          grep -q 'targetSdkVersion = 36' mobile/android/variables.gradle
          grep -q 'versionCode 2000004' mobile/android/app/build.gradle
          grep -q 'versionName "2.0.2"' mobile/android/app/build.gradle
          grep -q 'CURRENT_PROJECT_VERSION = 2000004;' mobile/ios/App/App.xcodeproj/project.pbxproj
          grep -q 'MARKETING_VERSION = 2.0.2;' mobile/ios/App/App.xcodeproj/project.pbxproj
          git diff --check
      - name: Commit tested source atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/store-release-finish.yml
          git add mobile/TESTING.md mobile/src/runtime.mjs scripts/check-store-readiness.mjs src/privacy.html
          git commit -m 'Finalize native store disclosures and release package'
          git push origin HEAD:feature/store-release-package
