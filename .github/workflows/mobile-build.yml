name: Native preview builds
on:
  push:
    branches: [feature/routing-first]
    paths: ['mobile/**', 'src/**', 'build.mjs', '.github/workflows/mobile-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-preview-${{ github.ref }}
  cancel-in-progress: true
env:
  DL_API_ORIGIN: https://drivers-lounge-d5b2e2l0y-steves-projects-c46af6ff.vercel.app
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm ci --prefix mobile
      - run: npm test --prefix mobile
      - run: npm run build --prefix mobile
      - run: node mobile/scripts/platforms.mjs android
      - name: Compile Android debug app
        run: bash gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - name: Prepare Android testing download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/test-artifacts
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/test-artifacts/Drivers-Lounge-Test.apk
          cp mobile/TESTING.md mobile/test-artifacts/START-HERE.md
          cp mobile/www/native-build.json mobile/test-artifacts/build-info.json
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$signer" verify --verbose --print-certs mobile/test-artifacts/Drivers-Lounge-Test.apk > mobile/test-artifacts/android-signature.txt
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$aapt" dump badging mobile/test-artifacts/Drivers-Lounge-Test.apk > mobile/test-artifacts/android-package.txt
          grep -q "package: name='dev.atlasdigital.driverslounge.preview'" mobile/test-artifacts/android-package.txt
          grep -q "application-label:'Drivers Lounge Test'" mobile/test-artifacts/android-package.txt
          sha256sum mobile/test-artifacts/Drivers-Lounge-Test.apk > mobile/test-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: drivers-lounge-android-preview
          path: mobile/test-artifacts/
          if-no-files-found: error
          retention-days: 14
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci --prefix mobile
      - run: npm test --prefix mobile
      - run: npm run build --prefix mobile
      - run: node mobile/scripts/platforms.mjs ios
      - name: Compile iOS simulator app
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile
      - name: Package simulator artifact
        run: ditto -c -k --sequesterRsrc --keepParent mobile/build/Build/Products/Debug-iphonesimulator/App.app mobile/drivers-lounge-ios-simulator.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: drivers-lounge-ios-simulator-preview
          path: mobile/drivers-lounge-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
