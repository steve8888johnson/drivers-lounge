name: Apply verified bulletproof routing patch

on:
  workflow_dispatch:
  push:
    branches: [feature/routing-bulletproof]
    paths:
      - .github/workflows/apply-routing-bulletproof.yml

permissions:
  contents: write

concurrency:
  group: apply-routing-bulletproof
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out isolated routing branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/routing-bulletproof
          fetch-depth: 2

      - name: Download and verify tested patch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 2 \
            --output /tmp/routing-bulletproof.patch.gz \
            'https://sb-4t7bon1xw2po.vercel.run/routing-bulletproof.patch.gz'
          echo '0117a9ae50fcabb58f0c625db75aeff773960183d9c02ddcb322d099a80e6030  /tmp/routing-bulletproof.patch.gz' | sha256sum -c -
          gzip -dc /tmp/routing-bulletproof.patch.gz > /tmp/routing-bulletproof.patch
          echo 'da01ea02f8beffa98c40d7dd13f5abf426b70a37abf2f9d22618783c21690e9a  /tmp/routing-bulletproof.patch' | sha256sum -c -

      - name: Apply the exact verified tree
        shell: bash
        run: |
          set -euo pipefail
          git apply --index --whitespace=error-all /tmp/routing-bulletproof.patch
          # GitHub's automation token cannot update workflow files. That reviewed
          # one-line workflow change is applied separately through the GitHub API.
          git restore --source=HEAD --staged --worktree .github/workflows/mobile-build.yml
          git diff --cached --check

      - name: Commit and push isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Build Agent'
          git config user.email 'openai-build-agent@users.noreply.github.com'
          git commit -m 'Build fail-closed routing safety architecture'
          git push origin HEAD:feature/routing-bulletproof
