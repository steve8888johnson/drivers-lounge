name: Native field evidence gate
on:
  push:
    branches: [feature/routing-field-evidence]
permissions:
  contents: write
concurrency:
  group: routing-field-evidence-${{ github.ref }}
  cancel-in-progress: true
env:
  DL_API_ORIGIN: https://drivers-lounge-9cpom9f9u-steves-projects-c46af6ff.vercel.app
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/routing-field-evidence
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Apply validated field-evidence patch
        run: python .github/apply-routing-field-evidence.py
      - run: npm ci
      - run: npm ci --prefix mobile
      - run: node --test scripts/test-native-field-evidence.mjs
      - run: npm test --prefix mobile
      - run: npm test
      - run: npm run check:syntax
      - name: Verify complete web release gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://routing-field-evidence-ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_routing_field_evidence_ci_validation_only_123456789
          VERCEL_ENV: preview
        run: npm run build
      - run: npm run build --prefix mobile
      - run: node mobile/scripts/platforms.mjs android ios
      - name: Verify generated native field-evidence assets and versions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode 2000004' mobile/android/app/build.gradle
          grep -q 'versionName "2.0.2"' mobile/android/app/build.gradle
          grep -q 'CURRENT_PROJECT_VERSION = 2000004;' mobile/ios/App/App.xcodeproj/project.pbxproj
          grep -q 'MARKETING_VERSION = 2.0.2;' mobile/ios/App/App.xcodeproj/project.pbxproj
          grep -q 'field-gate' mobile/android/app/src/main/assets/public/native-diagnostics.html
          test -f mobile/android/app/src/main/assets/public/assets/native-field-evidence.mjs
          test -f mobile/android/app/src/main/assets/public/assets/native-field-evidence-ui.mjs
          grep -q 'field-gate' mobile/ios/App/App/public/native-diagnostics.html
          test -f mobile/ios/App/App/public/assets/native-field-evidence.mjs
          test -f mobile/ios/App/App/public/assets/native-field-evidence-ui.mjs
          git diff --check
      - name: Commit tested source atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/apply-routing-field-evidence.py .github/workflows/routing-field-evidence-ci.yml
          git add build.mjs package.json scripts mobile src
          git commit -m 'Add privacy-minimized native field evidence gate'
          git push origin HEAD:feature/routing-field-evidence
  android:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/routing-field-evidence
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix mobile
      - run: npm test --prefix mobile
      - run: npm run build --prefix mobile
      - run: node mobile/scripts/platforms.mjs android
      - name: Compile Android field-evidence test app
        run: bash gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - name: Verify Android artifact and merged safety declarations
        shell: bash
        run: |
          set -euo pipefail
          apk=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          manifest="$(find mobile/android/app/build/intermediates -path '*/merged_manifests/*/AndroidManifest.xml' -o -path '*/packaged_manifests/*/AndroidManifest.xml' | head -n 1)"
          test -f "$manifest"
          grep -q 'android.permission.POST_NOTIFICATIONS' "$manifest"
          grep -q 'android.permission.FOREGROUND_SERVICE_LOCATION' "$manifest"
          grep -q 'BackgroundGeolocationService' "$manifest"
          grep -q 'android:exported="false"' "$manifest"
          grep -q 'field-gate' mobile/android/app/src/main/assets/public/native-diagnostics.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: drivers-lounge-field-evidence-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  ios:
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/routing-field-evidence
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci
      - run: npm ci --prefix mobile
      - run: npm test --prefix mobile
      - run: npm run build --prefix mobile
      - run: node mobile/scripts/platforms.mjs ios
      - name: Verify iOS version, field evidence, and background declarations
        shell: bash
        run: |
          set -euo pipefail
          plist=mobile/ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$plist" | grep -q location
          /usr/libexec/PlistBuddy -c 'Print :NSLocationAlwaysAndWhenInUseUsageDescription' "$plist" | grep -q 'Location use ends when you stop guidance'
          grep -q 'CURRENT_PROJECT_VERSION = 2000004;' mobile/ios/App/App.xcodeproj/project.pbxproj
          grep -q 'MARKETING_VERSION = 2.0.2;' mobile/ios/App/App.xcodeproj/project.pbxproj
          grep -q 'field-gate' mobile/ios/App/App/public/native-diagnostics.html
      - name: Compile iOS simulator field-evidence app
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: drivers-lounge-field-evidence-ios-simulator
          path: mobile/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 14
