name: Production environment test isolation
on:
  push:
    branches: [feature/production-test-isolation]
permissions:
  contents: write
concurrency:
  group: production-test-isolation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/production-test-isolation
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Make consensus tests independent of ambient deployment environment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/test-truck-route-consensus.mjs');s=p.read_text()
          s=s.replace("import{distanceMeters}from'../src/assets/routing/core.mjs';", "import{distanceMeters}from'../src/assets/routing/core.mjs';\nimport{readRoutingPolicy}from'../src/assets/routing/routing-policy.mjs';",1)
          s=s.replace("const providers=[{id:'here',label:'HERE Routing API v8',key:'here-secret'},{id:'tomtom',label:'TomTom Routing API v1',key:'tomtom-secret'}];", "const providers=[{id:'here',label:'HERE Routing API v8',key:'here-secret'},{id:'tomtom',label:'TomTom Routing API v1',key:'tomtom-secret'}];\nconst previewPolicy=readRoutingPolicy({VERCEL_ENV:'preview'}),productionPolicy=readRoutingPolicy({VERCEL_ENV:'production'});",1)
          s=s.replace("{calculator,providers:[providers[1]]});", "{calculator,providers:[providers[1]],policy:previewPolicy});",1)
          s=s.replace("},{calculator,providers});", "},{calculator,providers,policy:previewPolicy});")
          marker="test('two aligned providers return a high-confidence route candidate',async()=>{\n"
          insert="""test('production policy blocks a single-provider route candidate',async()=>{
           const calculator=async()=>makeResult('TomTom Routing API v1');
           const result=await calculateConsensusTruckRoute({origin:{address:'A'},destination:{address:'B'}},{calculator,providers:[providers[1]],policy:productionPolicy});
           assert.equal(result.crossCheck.status,'single-provider');
           assert.equal(result.route.guidanceEligible,false);
           assert.equal(result.route.criticalNotices.at(-1).code,'independentCrossCheckRequired');
          });

          """
          if insert not in s:
              if marker not in s: raise SystemExit('Consensus test insertion marker missing')
              s=s.replace(marker,insert+marker,1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: node --test scripts/test-truck-route-consensus.mjs
      - run: VERCEL_ENV=production node --test scripts/test-truck-route-consensus.mjs
      - run: npm test
      - run: VERCEL_ENV=production npm test
      - run: npm run check:syntax
      - run: git diff --check
      - name: Commit tested source atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/production-test-isolation.yml
          git add scripts/test-truck-route-consensus.mjs
          git commit -m 'Isolate routing consensus tests from deployment environment'
          git push origin HEAD:feature/production-test-isolation
